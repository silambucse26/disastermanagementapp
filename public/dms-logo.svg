<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M64 8 L112 28 C112 76 64 118 64 118 C64 118 16 76 16 28 Z" fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Inner White Trim -->
  <path d="M64 16 L104 33 C104 72 64 108 64 108 C64 108 24 72 24 33 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
  
  <!-- Central Red Emergency Cross -->
  <path d="M54 38 H74 V52 H88 V72 H74 V88 H54 V72 H40 V52 H54 Z" fill="url(#crestGrad)" stroke="#ffffff" stroke-width="2" />
  
  <!-- Gold Hazard Star / Center Badge -->
  <polygon points="64,52 67,61 76,64 67,67 64,76 61,67 52,64 61,61" fill="#fbbf24" stroke="#ffffff" stroke-width="1" />
  
  <!-- Base Radiance Dot -->
  <circle cx="64" cy="64" r="2.5" fill="#ffffff" />
</svg>
